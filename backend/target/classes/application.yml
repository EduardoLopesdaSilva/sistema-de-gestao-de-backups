server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: backup-control-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:2GB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:4GB}
app:
  storage-root: ${BACKUP_STORAGE_ROOT:./var/backups}
  upload:
    max-file-bytes: ${UPLOAD_MAX_FILE_BYTES:2147483648}
    allowed-extensions: ${UPLOAD_ALLOWED_EXTENSIONS:pdf,txt,csv,json,png,jpg,jpeg,zip,docx,xlsx,pptx,mp4,mp3,7z}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  security:
    seed-admin: ${APP_SECURITY_SEED_ADMIN:true}
  free-space:
    warning-gb: ${FREE_SPACE_WARNING_GB:100}
    critical-gb: ${FREE_SPACE_CRITICAL_GB:20}
  analysis:
    old-file-days: ${OLD_FILE_DAYS:365}
