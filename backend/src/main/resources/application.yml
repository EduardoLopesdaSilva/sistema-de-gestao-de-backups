server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: strict
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 20MB
  application:
    name: backup-control-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
app:
  auth:
    initial-password: "${AUTH_INITIAL_PASSWORD:}"
  email-access:
    encryption-key: ${EMAIL_ACCESS_ENCRYPTION_KEY:}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  free-space:
    warning-gb: ${FREE_SPACE_WARNING_GB:100}
    critical-gb: ${FREE_SPACE_CRITICAL_GB:20}
  analysis:
    old-file-days: ${OLD_FILE_DAYS:365}
