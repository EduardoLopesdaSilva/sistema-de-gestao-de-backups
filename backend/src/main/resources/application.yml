server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 20MB
  application:
    name: backup-control-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  email-access:
    access-token: ${EMAIL_ACCESS_TOKEN:}
    encryption-key: ${EMAIL_ACCESS_ENCRYPTION_KEY:}
  cors-origin: ${CORS_ORIGIN:http://localhost:3000}
  free-space:
    warning-gb: ${FREE_SPACE_WARNING_GB:100}
    critical-gb: ${FREE_SPACE_CRITICAL_GB:20}
  analysis:
    old-file-days: ${OLD_FILE_DAYS:365}
